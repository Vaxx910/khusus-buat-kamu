<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Untuk Najwa ✨ — From Yuyun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #030409;
      --card-bg: rgba(12, 16, 28, 0.75);
      --border-color: rgba(244, 63, 94, 0.25);
      --border-hover: rgba(244, 63, 94, 0.6);
      --accent-pink: #f43f5e;
      --accent-pink-hover: #e11d48;
      --accent-emerald: #10b981;
      --accent-emerald-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(244, 63, 94, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Interactive Canvas Background */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      width: 450px;
      height: 450px;
      background: rgba(244, 63, 94, 0.18);
      filter: blur(140px);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.25); opacity: 0.9; }
    }

    /* Top Control Bar */
    .top-bar {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .glass-btn {
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-btn:hover {
      border-color: var(--accent-pink);
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(244, 63, 94, 0.3);
    }

    /* Wrapper & Card */
    .wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #f43f5e, #fb7185, #34d399);
      background-size: 200% 100%;
      width: 10%;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.7);
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: 32px;
      padding: 48px 38px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.85), 0 0 50px rgba(244, 63, 94, 0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.9), 0 0 60px rgba(244, 63, 94, 0.18);
    }

    .step {
      display: none;
      flex-direction: column;
      gap: 26px;
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .step.active {
      display: flex;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .badge {
      align-self: center;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fb7185;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.15);
    }

    .text-message {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.75;
      color: #f8fafc;
      letter-spacing: -0.01em;
      min-height: 4.5em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    /* Typewriter Cursor */
    .typing-cursor {
      display: inline-block;
      width: 2.5px;
      height: 1.1em;
      background-color: var(--accent-pink);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.75s infinite;
      box-shadow: 0 0 10px var(--accent-pink);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-pink) 0%, #be123c 100%);
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: rotate(45deg) translateX(-100%);
      transition: transform 0.6s ease;
    }

    .btn-primary:hover::after {
      transform: rotate(45deg) translateX(100%);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px -5px rgba(244, 63, 94, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, #fb7185 0%, var(--accent-pink-hover) 100%);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      position: relative;
    }

    .btn-accept {
      background: linear-gradient(135deg, var(--accent-emerald) 0%, #047857 100%);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .btn-accept:hover {
      box-shadow: 0 15px 35px -5px rgba(16, 185, 129, 0.75);
      background: linear-gradient(135deg, #34d399 0%, var(--accent-emerald-hover) 100%);
    }

    .btn-reject {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      box-shadow: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-reject:hover {
      background: rgba(244, 63, 94, 0.15);
      color: #fff;
      border-color: var(--accent-pink);
    }

    .final-message {
      font-size: 1.35rem;
      font-weight: 700;
      color: #34d399;
      line-height: 1.7;
      text-shadow: 0 0 30px rgba(52, 211, 153, 0.45);
      min-height: 4.5em;
    }

    .footer-note {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.8px;
    }

    /* Confetti Burst Overlay */
    .confetti-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Interactive Particle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://d.uguu.se/OckwoTzz.mp3" type="audio/mpeg">
  </audio>

  <!-- Top Controls -->
  <div class="top-bar">
    <button class="glass-btn" onclick="toggleMusic()">
      <span id="musicIcon">🎵</span> <span id="musicText">Musik: Off</span>
    </button>
  </div>

  <div class="ambient-glow"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="wrapper">
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div class="card">
      
      <!-- Step 1 -->
      <div id="step-1" class="step active">
        <div class="badge">Pesan Khusus</div>
        <div class="text-message" data-text="HAII NAJWA, WEB INI DIBUAT SPESIAL HANYA UNTUK KAMU ✨"></div>
        <button class="btn-primary" onclick="nextStep(1, 10)">LANJUTKAN 🚀</button>
      </div>

      <!-- Step 2 -->
      <div id="step-2" class="step">
        <div class="badge">Tentang Kamu</div>
        <div class="text-message" data-text="NAJWA, KAMU ORANG PERTAMA YANG BIKIN SAYA JATUH CINTA SEDALAM INI"></div>
        <button class="btn-primary" onclick="nextStep(2, 20)">LANJUTKAN ✨</button>
      </div>

      <!-- Step 3 -->
      <div id="step-3" class="step">
        <div class="badge">Perasaan Ini</div>
        <div class="text-message" data-text="KAMU JUGA ORANG PERTAMA YANG BIKIN SAYA PERTAMA KALI SESAYANG INI SAMA PEREMPUAN"></div>
        <button class="btn-primary" onclick="nextStep(3, 30)">LANJUTKAN ✨</button>
      </div>

      <!-- Step 4 -->
      <div id="step-4" class="step">
        <div class="badge">Ketertarikan</div>
        <div class="text-message" data-text="KAMU JUGA ORANG PERTAMA YANG BIKIN SAYA SETERTARIK INI DENGAN PEREMPUAN"></div>
        <button class="btn-primary" onclick="nextStep(4, 40)">LANJUTKAN ✨</button>
      </div>

      <!-- Step 5 -->
      <div id="step-5" class="step">
        <div class="badge">Karaktermu</div>
        <div class="text-message" data-text="SAYA SUKA KAMU DARI SIFAT MU YANG LUCU DAN GAMPANG MARAH"></div>
        <button class="btn-primary" onclick="nextStep(5, 50)">LANJUTKAN ✨</button>
      </div>

      <!-- Step 6 -->
      <div id="step-6" class="step">
        <div class="badge">Kekaguman</div>
        <div class="text-message" data-text="KAMU PEREMPUAN PALING CANTIK YANG PERNAH KUTEMUI DI SEKOLAH"></div>
        <button class="btn-primary" onclick="nextStep(6, 60)">LANJUTKAN ✨</button>
      </div>

      <!-- Step 7 -->
      <div id="step-7" class="step">
        <div class="badge">Sisi Menarikmu</div>
        <div class="text-message" data-text="KAMU JUGA ORANG PALING LUCU YANG PERNAH KUTEMUI DI SEKOLAH"></div>
        <button class="btn-primary" onclick="nextStep(7, 70)">LANJUTKAN ✨</button>
      </div>

      <!-- Step 8 -->
      <div id="step-8" class="step">
        <div class="badge">Momen Ini</div>
        <div class="text-message" data-text="INI KEDUA KALINYA SAYA JATUH CINTA SAMA KAMU"></div>
        <button class="btn-primary" onclick="nextStep(8, 80)">LANJUTKAN ✨</button>
      </div>

      <!-- Step 9 (Pertanyaan Utama) -->
      <div id="step-9" class="step">
        <div class="badge">Pertanyaan Utama</div>
        <div class="text-message" data-text="KAMU MAU GA JADI PACAR SAYA? INI KEDUA KALINYA SAYA NEMBAK KAMU, KALAU KAMU TOLAK SAYA GA AKAN PERNAH NYERAH BUAT DAPATIN KAMU❤️"></div>
        <div class="btn-group">
          <button class="btn-primary btn-accept" onclick="sendAnswer('TERIMA ❤️')">TERIMA</button>
          <button class="btn-primary btn-reject" id="rejectBtn" onmouseover="evadeButton()" ontouchstart="evadeButton()" onclick="sendAnswer('TOLAK 💔')">TOLAK</button>
        </div>
      </div>

      <!-- Step 10 (Final) -->
      <div id="step-10" class="step">
        <div class="badge" style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: #34d399;">Berhasil Terkirim!</div>
        <div class="final-message" data-text="TERIMAKASIH UDAH JAWAB YA NAJWA, NOTIFIKASI PILIHANMU SUDAH MASUK KE TELEGRAM YUYUN ✨"></div>
      </div>

    </div>

    <div class="footer-note">Dibuat oleh yuyun untuk najwa ✨</div>
  </div>

  <script>
    const TELEGRAM_BOT_TOKEN = '8993484744:AAG8vtKU0JO0GJId3VsgixDsq_j7UaQYfxI';
    const TELEGRAM_CHAT_ID = '8664741564';

    const bgMusic = document.getElementById('bgMusic');
    const musicText = document.getElementById('musicText');
    let isMusicPlaying = false;
    let typingTimeout = null;

    // Auto Play Audio on First Interaction
    function startAudio() {
      if (!isMusicPlaying) {
        bgMusic.play().then(() => {
          isMusicPlaying = true;
          musicText.innerText = 'Musik: On';
        }).catch(() => {});
      }
      document.removeEventListener('click', startAudio);
    }
    document.addEventListener('click', startAudio);

    function toggleMusic() {
      if (isMusicPlaying) {
        bgMusic.pause();
        isMusicPlaying = false;
        musicText.innerText = 'Musik: Off';
      } else {
        bgMusic.play();
        isMusicPlaying = true;
        musicText.innerText = 'Musik: On';
      }
    }

    // Interactive Particle / Heart Background Engine
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 50;
        this.size = Math.random() * 4 + 2;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.opacity = Math.random() * 0.6 + 0.2;
        this.color = Math.random() > 0.3 ? 'rgba(244, 63, 94,' : 'rgba(59, 130, 246,';
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -50) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `${this.color} ${this.opacity})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color === 'rgba(244, 63, 94,' ? '#f43f5e' : '#3b82f6';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Playful Evasion for Rejection Button
    function evadeButton() {
      const btn = document.getElementById('rejectBtn');
      const x = (Math.random() - 0.5) * 220;
      const y = (Math.random() - 0.5) * 120;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Typewriter Effect
    function typeEffect(element, speed = 30) {
      if (typingTimeout) clearTimeout(typingTimeout);

      const fullText = element.getAttribute('data-text');
      element.innerHTML = '';
      
      const cursor = document.createElement('span');
      cursor.className = 'typing-cursor';
      
      let index = 0;

      function typeChar() {
        if (index < fullText.length) {
          element.innerHTML = fullText.substring(0, index + 1);
          element.appendChild(cursor);
          index++;
          typingTimeout = setTimeout(typeChar, speed);
        } else {
          if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
        }
      }

      typeChar();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const firstMessage = document.querySelector('#step-1 .text-message');
      if (firstMessage) typeEffect(firstMessage);
    });

    function nextStep(current, progressPercent) {
      const currentEl = document.getElementById(`step-${current}`);
      const nextEl = document.getElementById(`step-${current + 1}`);
      const progressBar = document.getElementById('progressBar');

      progressBar.style.width = `${progressPercent + 10}%`;

      currentEl.classList.remove('active');
      setTimeout(() => {
        nextEl.classList.add('active');
        const msgElement = nextEl.querySelector('.text-message');
        if (msgElement) typeEffect(msgElement);
      }, 350);
    }

    function triggerConfetti() {
      const container = document.getElementById('confettiContainer');
      for (let i = 0; i < 60; i++) {
        const dot = document.createElement('div');
        dot.style.position = 'absolute';
        dot.style.width = `${Math.random() * 8 + 4}px`;
        dot.style.height = `${Math.random() * 8 + 4}px`;
        dot.style.background = Math.random() > 0.5 ? '#f43f5e' : '#34d399';
        dot.style.left = '50%';
        dot.style.top = '50%';
        dot.style.borderRadius = '50%';
        dot.style.zIndex = '1000';
        container.appendChild(dot);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 200 + 50;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;

        dot.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
        ], {
          duration: 1200 + Math.random() * 800,
          easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
        }).onfinish = () => dot.remove();
      }
    }

    async function sendAnswer(answer) {
      if (answer.includes('TERIMA')) triggerConfetti();

      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('step-9').classList.remove('active');
      
      const finalEl = document.getElementById('step-10');
      setTimeout(() => {
        finalEl.classList.add('active');
        const finalMsg = finalEl.querySelector('.final-message');
        if (finalMsg) typeEffect(finalMsg);
      }, 350);

      const message = `✨ Jawaban Spesial dari Najwa:\n\n*${answer}*`;
      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

      try {
        await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
          })
        });
      } catch (error) {
        console.error('Gagal mengirim ke Telegram:', error);
      }
    }
  </script>
</body>
</html>
